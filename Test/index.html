<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FineDine</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        font-size: 20px;
      }
      nav {
        background-color: black;
        height: 150px;
        width: 100vw;
        color: white;
      }
      .img > img {
        height: 150px;
        border-radius: 50%;
        margin-left: 2vw;
      }
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .menu {
        margin-left: 10vw;
      }
      .menu > ul,
      .login > ul {
        display: flex;
        justify-content: space-between;
        align-items: center;
        list-style-type: none;
      }
      a {
        text-decoration: none;
        color: white;
      }
      .menu > ul > li {
        margin-right: 4vw;
      }
      .login > ul > li {
        margin-right: 2vw;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <div class="img">
          <img
            src="https://finedine-restaurant.netlify.app/navlogo.png"
            alt=""
          />
        </div>
        <div class="menu">
          <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Menu</a></li>
            <li><a href="">Award</a></li>
            <li><a href="">Contact</a></li>
          </ul>
        </div>
        <div class="login">
          <ul>
            <li><a href="">Login / Register &nbsp;&nbsp;|</a></li>
            <li><a href="">Book Table</a></li>
          </ul>
        </div>
      </nav>
    </header>
  </body>
</html>
